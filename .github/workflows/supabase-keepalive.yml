# Supabase の無料プランは、1週間ほどアクセスがないとプロジェクトが止まる。
# 3日おきに軽い問い合わせ（ping）を送って、止まらないようにする。
name: Supabase keepalive
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (Tokyo)
        run: |
          curl -fsS -X POST "https://nlstbgnflnchjpnqnelr.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_bLXkuhZMT1-Dv000H8Fm3g_8-mBaYPY" \
            -H "Content-Type: application/json" -d '{}'
