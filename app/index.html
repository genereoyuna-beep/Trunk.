<style>
/* 時刻表のような白グレーの地に紺の文字。状態は 橙＝未手配 / 青＝予約済み / 紺＝支払い済み / 灰＝不要。
   スマホは下のタブ、PCは左のナビ。単一テーマ（ライト）で、色はすべてここで明示する。 */
:root{
  --ground:#F3F4F1; --surface:#FFFFFF; --sunk:#ECEEE9; --sunk2:#E4E6E1; --line:#DADDD6;
  --ink:#15202B; --muted:#5A6470; --faint:#8A929A;
  --blue:#1D4ED8; --blue-ink:#173A96; --blue-soft:#E3ECFD; --blue-band:#DCE6FB;
  --orange:#B45309; --orange-ink:#8A3B06; --orange-bar:#E8892B; --orange-soft:#FDEBD3; --orange-stripe:#F6C996;
  --danger:#B42318; --danger-soft:#FDE7E4;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --f-mono:"Chivo Mono","Noto Sans JP","Hiragino Sans",sans-serif;
  --f-local:"Helvetica Neue",Arial,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic","PingFang TC","Noto Sans JP",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:var(--blue)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
.xs{font-size:11px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance}
h1{font-size:22px} h2{font-size:18px} h3{font-size:15px}

/* ---- 骨組み ---- */
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);display:flex;align-items:center;gap:8px;padding:8px 12px 8px 16px;border-bottom:1px solid transparent}
.topbar.scrolled{border-bottom-color:var(--line)}
.tripbtn{display:flex;align-items:center;gap:6px;border:0;background:none;padding:8px 4px;min-height:44px;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.02em;min-width:0}
.tripbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:44px;height:44px;border:0;background:none;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.iconbtn:hover{background:var(--sunk)}
.spacer{flex:1 1 auto}
.main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:4px 16px 110px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 4px calc(10px + env(safe-area-inset-bottom,0px))}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:48px;font-size:11px;color:var(--muted);border-radius:10px}
.nav button[aria-current="page"]{color:var(--ink);font-weight:700}
.nav .badge{position:absolute;margin:-14px 0 0 22px;background:var(--orange-bar);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;padding:0 4px;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono)}
.nav .navicon{position:relative;display:flex}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:200px minmax(0,1fr);grid-template-rows:auto 1fr}
  .topbar{grid-column:1 / -1}
  .nav{position:sticky;top:64px;align-self:start;grid-row:2;display:flex;flex-direction:column;gap:2px;border:0;background:none;padding:8px 8px 8px 12px}
  .nav button{flex-direction:row;justify-content:flex-start;gap:10px;font-size:14px;padding:10px 12px;min-height:44px}
  .nav button[aria-current="page"]{background:var(--surface)}
  .nav .badge{position:static;margin:0 0 0 auto}
  .main{padding:8px 24px 60px;grid-row:2;margin:0}
}

/* ---- 共通部品 ---- */
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--surface);border-radius:14px;padding:14px;min-width:0}
.card.flush{padding:0;overflow:hidden}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:8px 0 10px}
.btn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#F3F4F1}
a.btn{text-decoration:none;color:var(--ink)}
a.btn.primary{color:#F3F4F1}
a.btn.ghost{color:var(--muted)}
.btn.small{min-height:34px;padding:0 10px;font-size:12px}
.btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.block{width:100%}
.seg{display:grid;grid-auto-columns:minmax(0,1fr);grid-auto-flow:column;gap:2px;padding:3px;background:var(--sunk2);border-radius:11px}
.seg button{min-height:36px;border:0;border-radius:8px;background:none;color:var(--muted);font-size:13px}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipsep{width:1px;align-self:stretch;background:var(--line);margin:4px 2px}
.chip{min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#F3F4F1}
.chip b{font-family:var(--f-mono);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:3px;background:currentColor}
.tone-open{background:var(--orange-soft);color:var(--orange-ink)}
.tone-booked{background:var(--blue-soft);color:var(--blue)}
.tone-paid{background:var(--ink);color:#F3F4F1}
.tone-none{background:var(--sunk);color:#3D4650}
.empty{color:var(--muted);font-size:13px;padding:18px 14px;text-align:center}
.note{font-size:12px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:10px 12px}
.err{font-size:12px;color:var(--danger);background:var(--danger-soft);border-radius:10px;padding:10px 12px}
.divide > * + *{border-top:1px solid var(--sunk)}

/* ---- ホーム ---- */
.hero{background:var(--ink);color:#F3F4F1;border-radius:16px;padding:18px}
.hero .lbl{font-size:12px;letter-spacing:.08em;color:#B9C2CC}
.hero .big{font-family:var(--f-mono);font-weight:600;font-size:52px;line-height:1;letter-spacing:-.02em}
.hero .route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:16px;font-family:var(--f-mono);font-size:13px}
.hero .route small{display:block;color:#B9C2CC;font-size:11px}
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin:10px 0;background:var(--sunk)}
.bar span{display:block;min-width:0}
.legend{display:flex;flex-direction:column;gap:2px;font-size:12px}
.legend b{font-family:var(--f-mono)}
.todo{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;width:100%;text-align:left;border:0;background:none;min-height:56px}
.todo:hover{background:#FAFAF8}
.ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.ico.open{background:var(--orange-soft);color:var(--orange)}
.ico.blue{background:var(--blue-soft);color:var(--blue)}
.ico.urgent{background:var(--danger-soft);color:var(--danger)}
.t1{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t2{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.homegrid{display:grid;gap:14px;grid-template-areas:"a" "b" "c"}
.h-a{grid-area:a}.h-b{grid-area:b}.h-c{grid-area:c}
@media (min-width:900px){.homegrid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-areas:"a b" "c b";align-items:start}}

/* ---- 旅程リスト ---- */
.itin{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stayrow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border-radius:14px;padding:12px 14px 12px 12px;width:100%;text-align:left;border:0;min-height:64px}
.stayrow:hover{box-shadow:0 0 0 1px var(--line)}
.datecol{text-align:center;font-family:var(--f-mono)}
.datecol b{display:block;font-size:15px;font-weight:600;line-height:1.2}
.datecol span{font-size:11px;color:var(--muted)}
.city{font-family:var(--f-display);font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.moverow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:7px 14px 7px 12px;min-height:46px;width:100%;text-align:left;border:0;background:none;font-size:12px}
.moverow:hover{background:rgba(255,255,255,.6);border-radius:12px}
.rail{display:flex;justify-content:center;align-self:stretch;align-items:center;position:relative}
.rail::before{content:"";position:absolute;top:-6px;bottom:-6px;left:50%;border-left:2px dotted #B5BAB3}
.mico{position:relative;width:28px;height:28px;border-radius:14px;background:var(--sunk2);display:flex;align-items:center;justify-content:center}
.mico.unknown{background:var(--orange-soft);color:var(--orange)}
.mstatus{font-size:11px;font-weight:500;white-space:nowrap}
.mstatus.open{color:var(--orange-ink)} .mstatus.booked{color:var(--blue)} .mstatus.paid{color:var(--ink)}

/* ---- 月（帯） ---- */
.months{display:flex;flex-wrap:wrap;gap:16px}
.month{flex:1 1 520px;min-width:0;background:var(--surface);border-radius:16px;padding:14px 12px 10px}
.wdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:11px;color:var(--muted);text-align:center;padding-bottom:6px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:24px 44px 6px;border-top:1px solid var(--sunk)}
.dcell{grid-row:1 / 4;display:flex;justify-content:space-between;align-items:flex-start;padding:3px 4px 0}
.dcell + .dcell{border-left:1px solid var(--sunk)}
.dcell .n{font-family:var(--f-mono);font-size:12px}
.dcell.out{background:#F7F8F5;color:#A3AAA1}
.dcell.today .n{background:var(--ink);color:#fff;border-radius:6px;padding:0 4px}
.mdot{width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--ink);color:#fff}
.mdot.unknown{background:var(--orange-soft);color:var(--orange)}
.band{grid-row:2;margin:0 2px;padding:3px 7px;min-width:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;border:0;text-align:left;cursor:pointer}
.band b{font-size:12px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band small{font-size:10.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band.booked,.band.paid{background:var(--blue-band);color:var(--blue-ink)}
.band.open{background:repeating-linear-gradient(135deg,var(--orange-soft) 0 6px,#FADBB4 6px 12px);color:var(--orange-ink)}
.band.none{background:var(--sunk2);color:#2F3842}
.band.night{background:var(--surface);color:#3D4650;outline:1px dashed var(--faint);outline-offset:-1px}
.legendrow{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:#3D4650}
.legendrow span{display:inline-flex;align-items:center;gap:6px}
.sw{width:22px;height:12px;border-radius:3px;display:inline-block}

/* ---- 日ごと ---- */
.day{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:12px 14px}
.day .when{font-family:var(--f-mono);text-align:center}
.day .when b{display:block;font-size:16px}
.ev{display:flex;align-items:baseline;gap:8px;font-size:13px;padding:2px 0;border:0;background:none;text-align:left;width:100%}
.ev .tm{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:44px}

/* ---- 予約・手配 ---- */
.bookrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;width:100%;text-align:left;border:0;background:none;min-height:60px}
.bookrow:hover{background:#FAFAF8}
.inboxitem{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.difftable{width:100%;border-collapse:collapse;font-size:12px}
.difftable td{padding:4px 6px 4px 0;border-top:1px solid var(--sunk);vertical-align:top;overflow-wrap:anywhere}
.difftable td:first-child{color:var(--muted);white-space:nowrap}
.difftable s{color:var(--faint)}

/* ---- お金 ---- */
.budget{width:100%;border-collapse:collapse;font-size:13px}
.budget th{text-align:left;font-size:11px;color:var(--muted);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--line)}
.budget td{padding:6px;border-bottom:1px solid var(--sunk);vertical-align:middle}
.budget input{width:100%;min-width:70px}
.over{color:var(--danger)}
.member{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 6px 0 12px;border-radius:999px;background:var(--sunk);font-size:13px}
.member button{border:0;background:none;width:28px;height:28px;border-radius:14px;color:var(--muted)}
.member.me{background:var(--ink);color:#F3F4F1}
.member.me button{color:#B9C2CC}

/* ---- 持ち物 ---- */
.packitem{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 12px;min-height:48px}
.packitem input[type=checkbox]{width:20px;height:20px;accent-color:var(--ink)}
.packitem.done .nm{color:var(--faint);text-decoration:line-through}

/* ---- 入力 ---- */
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.input,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface);color:var(--ink);font-size:14px;min-width:0;width:100%}
.field textarea{min-height:84px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fgrid .wide{grid-column:1 / -1}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);min-height:40px}
.toggle input{width:18px;height:18px;accent-color:var(--ink)}
.formsec{font-size:11px;letter-spacing:.08em;color:var(--muted);border-top:1px solid var(--sunk);padding-top:12px;margin-top:4px}

/* ---- シート（スマホは下から、PCは右から） ---- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(21,32,43,.32);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--ground);width:100%;max-width:640px;max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(21,32,43,.18)}
.sheet header{display:flex;align-items:center;gap:8px;padding:10px 8px 10px 18px;border-bottom:1px solid var(--line)}
.sheet header h2{flex:1;min-width:0;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .body{overflow:auto;padding:16px 18px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:900px){
  .scrim{align-items:stretch;justify-content:flex-end}
  .sheet{max-width:460px;max-height:none;height:100%;border-radius:0}
}
.menu{position:fixed;z-index:60;top:calc(56px + env(safe-area-inset-top,0px));right:12px;background:var(--surface);border-radius:14px;box-shadow:0 10px 30px rgba(21,32,43,.18);padding:6px;min-width:230px;display:flex;flex-direction:column}
.menu button{border:0;background:none;text-align:left;padding:10px 12px;border-radius:8px;min-height:44px;display:flex;align-items:center;gap:10px;font-size:14px}
.menu button:hover{background:var(--sunk)}
.menu hr{border:0;border-top:1px solid var(--sunk);margin:4px 0}
.menu{max-height:calc(100vh - 80px - env(safe-area-inset-top,0px));overflow-y:auto}
.menuhead{font-size:11px;color:var(--muted);padding:6px 12px 2px;letter-spacing:.04em}
.menu button.sub{padding-left:24px;font-size:13px;min-height:40px}
.noticebar{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:71;width:min(520px,calc(100% - 32px));background:var(--surface);color:var(--ink);border:2px solid var(--orange-bar);border-radius:14px;padding:14px 16px;font-size:13.5px;line-height:1.6;display:grid;gap:10px;box-shadow:0 8px 28px rgba(21,32,43,.18)}
.noticebar .btn{justify-self:end}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:#F3F4F1;padding:9px 16px;border-radius:10px;font-size:13px;max-width:calc(100% - 32px)}
.triprow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:12px 14px;width:100%;text-align:left;border:0;background:none;min-height:60px}
.triprow[aria-current="true"]{background:var(--blue-soft)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
